name: 📚 Learning task
description: A weekly task, project, or challenge for a career cell
title: "[Cell] "
labels: ["learning-task"]
body:
  - type: markdown
    attributes:
      value: Used by Cell Leaders to assign weekly work. Members can also propose a task.

  - type: dropdown
    id: cell
    attributes:
      label: Career cell
      options:
        - Software Engineering
        - Frontend Development
        - Backend Development
        - Cybersecurity
        - Cloud Computing
        - Data Analysis
        - Data Science
        - AI & Machine Learning
        - Cross-cell
    validations:
      required: true

  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - Beginner
        - Intermediate
        - Advanced
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Learning objective
      description: What should someone be able to do after finishing this?
      placeholder: Build and deploy a responsive landing page using semantic HTML and Flexbox.
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: The task
      description: What exactly should be built or completed?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Definition of done
      placeholder: |
        - [ ] Page renders correctly at 375px, 768px, and 1440px
        - [ ] Passes an accessibility check with no critical issues
        - [ ] Deployed and the link is posted in this issue
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: Resources
      description: Lessons, docs, or partner-platform courses that help.
    validations:
      required: false

  - type: input
    id: due
    attributes:
      label: Due date
      placeholder: 2026-09-05
    validations:
      required: false
